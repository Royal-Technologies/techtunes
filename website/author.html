<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>টেকটিউনার ডিরেক্টরি | টেকটিউনস আর্কাইভ</title>
  <meta name="description" content="টেকটিউনসে টিউন প্রকাশকারী সকল টেকটিউনার ও লেখকদের তালিকা।">
  <meta name="theme-color" content="#9575cd">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-link">
        <img src="assets/images/techtunes-logo-full.svg" alt="Techtunes Logo" class="brand-logo">
        <div class="brand-text-wrap">
          <span class="brand-title">টেকটিউনস আর্কাইভ</span>
          <span class="brand-tagline">মেতে উঠুন প্রযুক্তির সুরে</span>
        </div>
      </a>
      <button type="button" id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-nav">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <nav id="site-nav" class="site-nav">
        <a href="index.html" class="nav-link">প্রথমপাতা</a>
        <a href="archive.html" class="nav-link">আর্কাইভ</a>
        <a href="search.html" class="nav-link">সার্চ</a>
        <a href="categories.html" class="nav-link">বিভাগ</a>
        <a href="author.html" class="nav-link active">টিউনার</a>
        <a href="about.html" class="nav-link">সম্পর্কে</a>
        <button id="theme-toggle" class="theme-toggle-btn">🌙 Dark</button>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="section-header">
      <h1 class="section-title">টেকটিউনার ও লেখকবৃন্দ (Tuners)</h1>
      <span id="authors-count" style="font-size: 0.9rem; color: var(--text-muted);">লোড হচ্ছে...</span>
    </div>

    <div id="authors-container" class="authors-grid">
      <p style="color: var(--text-muted);">টিউনার তালিকা লোড হচ্ছে...</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>টেকটিউনস আর্কাইভ — টেকটিউনস কমিউনিটি টিউনার ডিরেক্টরি।</p>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('authors-container');
      const countEl = document.getElementById('authors-count');

      try {
        const resp = await window.ArchiveUtils.fetchAsset('exports/authors.json');
        let authors = [];
        if (resp.ok) {
          authors = await resp.json();
        }

        if (authors.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted);">এখনো কোনো টিউনার সংরক্ষিত হয়নি।</p>';
          return;
        }

        countEl.textContent = `${authors.length} জন টিউনার`;
        container.innerHTML = authors.map(a => {
          const fallbackAvatar = 'assets/images/favicon-192x192.png';
          const avatar = a.avatar_url || fallbackAvatar;
          return `
            <div class="author-card">
              <img src="${window.ArchiveUtils.escapeHtml(avatar)}" alt="${window.ArchiveUtils.escapeHtml(a.name)}" class="author-avatar" onerror="this.src='${fallbackAvatar}'">
              <div style="min-width: 0; flex: 1;">
                <h3 style="font-size: 1.05rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  <a href="search.html?author=${encodeURIComponent(a.name)}">${window.ArchiveUtils.escapeHtml(a.name)}</a>
                </h3>
                <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px;">
                  সংরক্ষিত টিউন: <strong>${a.article_count || 0}টি</strong>
                </div>
                <div style="display: flex; gap: 10px; font-size: 0.8rem;">
                  <a href="search.html?author=${encodeURIComponent(a.name)}">টিউন দেখুন →</a>
                  ${a.url ? `<a href="${window.ArchiveUtils.escapeHtml(a.url)}" target="_blank" rel="noopener">প্রোফাইল ↗</a>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p style="color: var(--text-muted);">টিউনার তথ্য লোড করা যায়নি।</p>';
      }
    });
  </script>
</body>
</html>
